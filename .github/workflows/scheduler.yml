name: scheduler

# Free "cron" that wakes the Vercel app. (Vercel Hobby only allows 1 cron per day.)
on:
  schedule:
    - cron: '*/30 * * * *'   # publish anything that is due
    - cron: '30 18 * * *'    # 00:00 IST - plan/render videos for the next days
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Publish due posts
        if: github.event.schedule != '30 18 * * *'
        run: curl -fsS --max-time 290 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/publish"
      - name: Plan new videos
        if: github.event.schedule == '30 18 * * *'
        run: curl -fsS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/generate"
